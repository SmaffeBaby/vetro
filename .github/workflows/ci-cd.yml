name: CI and production deploy

on:
  push:
    branches: [dev, main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: vetro-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  check:
    name: Build and typecheck
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run build

  deploy:
    name: Sync source and rebuild production
    needs: check
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    environment: production
    timeout-minutes: 30
    env:
      PRODUCTION_HOST: ${{ secrets.PRODUCTION_HOST }}
      PRODUCTION_USER: root
      PRODUCTION_APP_DIR: /opt/vetro
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Prepare SSH key
        env:
          PRODUCTION_SSH_KEY: ${{ secrets.PRODUCTION_SSH_KEY }}
          PRODUCTION_KNOWN_HOSTS: ${{ secrets.PRODUCTION_KNOWN_HOSTS }}
        run: |
          umask 077
          install -m 700 -d ~/.ssh
          printf '%s\n' "$PRODUCTION_SSH_KEY" > ~/.ssh/production_key
          printf '%s\n' "$PRODUCTION_KNOWN_HOSTS" > ~/.ssh/known_hosts
      - name: Sync source to production
        run: |
          rsync -az --delete \
            --exclude='.git/' \
            --exclude='.github/' \
            --exclude='node_modules/' \
            --exclude='.nuxt/' \
            --exclude='.output/' \
            --exclude='.data/' \
            --exclude='.env' \
            --exclude='.env.*' \
            --exclude='.deployment.env' \
            --exclude='supabase/.env' \
            --exclude='supabase/backups/' \
            --exclude='supabase/volumes/db/data/' \
            --exclude='supabase/volumes/storage/' \
            --exclude='supabase/volumes/snippets/' \
            --exclude='artifacts/' \
            --exclude='backups/' \
            -e 'ssh -i ~/.ssh/production_key -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes -o ServerAliveInterval=15' \
            ./ "$PRODUCTION_USER@$PRODUCTION_HOST:$PRODUCTION_APP_DIR/"
      - name: Rebuild production application
        run: |
          ssh -T -i ~/.ssh/production_key \
            -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes \
            -o ServerAliveInterval=15 -o ServerAliveCountMax=8 \
            "$PRODUCTION_USER@$PRODUCTION_HOST" \
            "DEPLOY_REVISION='$GITHUB_SHA' /bin/bash '$PRODUCTION_APP_DIR/deploy/deploy-production.sh'"
      - name: Check public deployment
        run: |
          curl --fail --silent --show-error --retry 5 --retry-delay 5 \
            "http://$PRODUCTION_HOST/api/health" > "$RUNNER_TEMP/health.json"
          python3 - <<'PY'
          import json, os
          from pathlib import Path
          health = json.loads((Path(os.environ['RUNNER_TEMP']) / 'health.json').read_text())
          assert health['ok'] and health['database'] == 'reachable', health
          assert health['revision'] == os.environ['GITHUB_SHA'], health
          print('Production is healthy at revision', health['revision'])
          PY
