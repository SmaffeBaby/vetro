name: vetro

include:
  - path:
      - ./supabase/docker-compose.yml
      - ./supabase/docker-compose.kong.yml
      - ./supabase/docker-compose.local.yml
    env_file: ./supabase/.env

services:
  app:
    build: .
    restart: unless-stopped
    env_file: .env
    environment:
      NUXT_SUPABASE_URL: http://api-gw:8000
      NITRO_HOST: 0.0.0.0
      NITRO_PORT: 3000
    depends_on:
      api-gw:
        condition: service_healthy
      rest:
        condition: service_started
    ports:
      - "0.0.0.0:3002:3000"
